server:
  port: "8080"

log:
  dir: "./logs"
  level: "debug"

jwt:
  key1: "cloudops-secret-key-1-change-in-prod"
  key2: "cloudops-secret-key-2-change-in-prod"
  issuer: "cloudops"
  expiration: 1440  # minutes (24h)

mysql:
  addr: "root:root@tcp(localhost:3306)/cloudops?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  addr: "localhost:6379"
  password: ""

casbin:
  model_path: "./config/rbac_model.conf"

ai:
  openai_api_key: ""
  openai_base_url: "https://api.openai.com/v1"
  chat_model: "gpt-4o-mini"
  embedding_model: "text-embedding-3-small"
